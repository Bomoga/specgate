name: CI

on:
  push:
    branches: [main, dev]
  # Every pull request, whatever it targets. Filtering to main and dev left a PR
  # stacked on another branch with no checks at all, which is the case most likely
  # to need them: it carries its parent's changes as well as its own.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build comes first, and the order is load bearing rather than incidental.
      # `packages/cli` resolves `@specgate/core` to that package's `dist`, not to its source,
      # so on a fresh checkout every cross-package import is TS2307 and the typecheck
      # fails with forty errors that say nothing about the code. Locally it passes only
      # because a `dist` from an earlier build is lying around, which is what hid this.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

  # Separate from `verify` on purpose. These need a Postgres, and pinning a service
  # container onto the main job would make every run pay for a database that almost
  # nothing in it uses. Keeping them apart also means a failure here names itself: the
  # tenant boundary broke, not "the tests broke".
  tenancy:
    name: tenancy, against a real Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: specgate
          POSTGRES_PASSWORD: specgate
          POSTGRES_DB: specgate_test
        ports:
          - 5433:5432
        # The job waits on readiness rather than on a sleep. A container that is up is not
        # the same fact as a database that will accept a connection.
        options: >-
          --health-cmd "pg_isready -U specgate -d specgate_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Row level security is a Postgres feature. It cannot be simulated in SQLite and a
      # mock of it asserts nothing, so invariant I9 is provable only here.
      - name: Tenancy
        run: pnpm --filter @specgate/server exec vitest run
        env:
          # Two roles on purpose. DATABASE_URL owns the schema and runs migrations.
          # DATABASE_APP_URL is the unprivileged role requests use, because a superuser
          # bypasses row level security outright and the image's configured user is one.
          DATABASE_URL: postgres://specgate:specgate@127.0.0.1:5433/specgate_test
          DATABASE_APP_URL: postgres://specgate_app:specgate_app@127.0.0.1:5433/specgate_test
